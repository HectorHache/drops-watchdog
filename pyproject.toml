[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drops-watchdog"
version = "0.1.0"
description = "Twitch Drops Watchdog: hourly drop-campaign watchdog + live dashboard (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["twitch", "drops", "watchdog", "telegram"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# bug-catching only — the codebase is a hand-tuned pipeline, not a library
select = ["F", "E9"]